<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz Results</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
<link rel="stylesheet" href="assets/css/styles.css" />
<link rel="stylesheet" href="assets/css/resultStyles.css" /></head>
<body><main class="app"><section class="panel result">
<h1>Your results</h1>
<div class="ring" id="ring"><span><span id="percentage-correct">0</span>%</span></div>
<ul class="stats">
<li><i class="fas fa-question-circle"></i> Total <b id="total-questions">0</b></li>
<li class="g"><i class="fas fa-check-circle"></i> Correct <b id="correct-answers">0</b></li>
<li class="r"><i class="fas fa-times-circle"></i> Wrong <b id="wrong-answers">0</b></li></ul>
<button id="retake-btn" class="btn primary" onclick="window.location.href='index.html'"><i class="fas fa-redo"></i> Pick another week</button>
</section></main>
<script src="assets/js/results.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>{const p=parseFloat(document.getElementById("percentage-correct").textContent)||0;document.getElementById("ring").style.setProperty("--p",p)});</script>
</body></html>
